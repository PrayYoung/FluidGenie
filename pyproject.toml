[project]
name = "fluidgenie"
version = "0.1.0"
description = "Neural forecasting and latent-action control for two-dimensional fluids."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FluidGenie contributors" }]
dependencies = [
    "einops>=0.8.2",
    "flax>=0.10.7",
    "imageio>=2.37.2",
    "jax>=0.6.2",
    "jaxtyping>=0.2.31",
    "grain>=0.2.12",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "optax>=0.2.6",
    "orbax-checkpoint>=0.11.0",
    "phiflow>=3.4.0",
    "pillow>=12.1.0",
    "tensorboardx>=2.6.4",
    "tqdm>=4.67.2",
    "tyro>=0.9.3",
]

[project.optional-dependencies]
cuda12 = [
    "jax[cuda12]>=0.6.2; platform_system == 'Linux'",
]
cuda13 = [
    "jax[cuda13]>=0.9.0; platform_system == 'Linux' and python_version >= '3.11'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fluidgenie*", "configs*"]

[tool.setuptools.package-data]
"fluidgenie.cli" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
