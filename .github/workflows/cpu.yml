name: CPU regression gates
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.10
      - run: uv sync --python 3.10 --group dev
      - run: uv run pytest -q
        env:
          JAX_PLATFORMS: cpu
